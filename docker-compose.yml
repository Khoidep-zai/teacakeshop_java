services:

  mysql:
    image: mysql:8.4
    container_name: tea-cake-shop-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - tea_cake_shop_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tea-cake-shop-backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${SERVER_PORT:-8080}:8080"

    depends_on:
      mysql:
        condition: service_healthy


volumes:
  tea_cake_shop_mysql_data: