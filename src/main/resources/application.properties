# =========================
# APPLICATION
# =========================

spring.application.name=tea_cake_shop

server.port=${SERVER_PORT:8080}

# =========================
# DATABASE
# =========================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tea_cake_shop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# =========================
# JWT ACCESS TOKEN
# =========================

# JWT_SECRET phải là Base64 hợp lệ.
# Sau khi giải mã phải có tối thiểu 32 bytes.
app.jwt.secret=${JWT_SECRET}

app.jwt.issuer=${JWT_ISSUER:tea-cake-shop}

# 900 giây = 15 phút
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

# =========================
# REFRESH TOKEN
# =========================

# 2.592.000 giây = 30 ngày
app.jwt.refresh-expiration-seconds=${REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}

# =========================
# CLOUDINARY
# =========================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =========================
# MULTIPART UPLOAD
# =========================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =========================
# SWAGGER / OPENAPI
# =========================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# =========================
# ERROR RESPONSE
# =========================

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# =========================
# ADMIN ACCOUNT SEEDER
# =========================

app.admin.full-name=${ADMIN_FULL_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:admin@teacakeshop.com}
app.admin.password=${ADMIN_PASSWORD}
app.admin.phone=${ADMIN_PHONE:0900000000}
